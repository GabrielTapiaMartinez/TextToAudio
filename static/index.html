<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader Companion</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --text-dim: #9ca3af;
            --highlight-bg: rgba(255, 255, 255, 0.04);
            --active-bg: rgba(64, 156, 255, 0.10);
            --control-bg: rgba(22, 22, 24, 0.85);
            --border-color: #27272a;
            --accent-color: #409cff;
            --accent-hover: #2a81e8;
            --warning-color: #f59e0b;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.85;
            font-size: 18px;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            padding-bottom: 140px; /* Space for sticky bottom player */
        }

        /* Top Bar */
        #top-bar {
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            border-bottom: 1px solid var(--border-color);
            background: #18181b;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        input[type="file"], select {
            background: #27272a;
            color: #fff;
            border: 1px solid #3f3f46;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        input[type="file"]:hover, select:hover {
            border-color: #52525b;
        }

        button.secondary {
            background: #27272a;
            color: #fff;
            border: 1px solid #3f3f46;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.secondary:hover {
            background: #3f3f46;
            border-color: #52525b;
        }

        /* Reader Content */
        #reader-container {
            max-width: 820px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .paragraph {
            margin-bottom: 1.6em;
            padding: 16px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            line-height: 1.9;
        }

        .paragraph:hover {
            background-color: var(--highlight-bg);
            border-color: #27272a;
        }

        .paragraph.active {
            background-color: var(--active-bg);
            border-left: 4px solid var(--accent-color);
            border-radius: 4px 12px 12px 4px;
        }

        /* Sentence Level Highlight & Synthesis states */
        .sentence {
            display: inline;
            border-radius: 4px;
            padding: 2px 3px;
            transition: background-color 0.2s ease, color 0.2s ease;
            cursor: pointer;
        }

        .sentence:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .sentence.active {
            background-color: rgba(64, 156, 255, 0.32);
            color: #ffffff;
            font-weight: 500;
            box-shadow: 0 0 10px rgba(64, 156, 255, 0.35);
        }

        .sentence.synthesizing {
            background-color: rgba(245, 158, 11, 0.25);
            color: #fef08a;
            animation: pulseSentence 1.2s infinite ease-in-out;
        }

        @keyframes pulseSentence {
            0% { background-color: rgba(245, 158, 11, 0.15); }
            50% { background-color: rgba(245, 158, 11, 0.40); }
            100% { background-color: rgba(245, 158, 11, 0.15); }
        }

        .loading {
            text-align: center;
            color: var(--text-dim);
            margin: 50px 0;
            font-style: italic;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        #paste-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            max-width: 820px;
            margin: 24px auto;
            padding: 0 24px;
        }
        
        #paste-textarea {
            width: 100%;
            height: 320px;
            background: #18181b;
            color: var(--text-color);
            border: 1px solid #3f3f46;
            border-radius: 10px;
            padding: 16px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        #paste-textarea:focus {
            border-color: var(--accent-color);
        }
        
        .paste-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        #btn-submit-text {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s;
        }
        #btn-submit-text:hover { background: var(--accent-hover); }

        /* Bottom Sticky Player (Glassmorphism) */
        #player-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--control-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 24px;
            border-radius: 36px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
            z-index: 1000;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
        }

        .icon-btn.primary {
            background: var(--accent-color);
            color: #fff;
            width: 50px;
            height: 50px;
        }

        .icon-btn.primary:hover {
            background: var(--accent-hover);
            transform: scale(1.08);
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .player-divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Status & Progress Pills */
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #d1d5db;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
            user-select: none;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9ca3af;
            display: inline-block;
            transition: all 0.3s;
        }

        .status-dot.ready { background: var(--success-color); box-shadow: 0 0 8px var(--success-color); }
        .status-dot.playing { background: var(--accent-color); box-shadow: 0 0 8px var(--accent-color); }
        .status-dot.loading { background: var(--warning-color); box-shadow: 0 0 8px var(--warning-color); animation: pulseDot 1s infinite; }
        .status-dot.error { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1.0; }
        }

        .progress-pill {
            font-size: 12px;
            font-family: monospace;
            color: var(--text-dim);
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <input type="file" id="file-upload" accept="application/pdf" />
        <span style="color: #666; font-size: 14px;">or</span>
        <button id="btn-paste-mode" class="secondary">Paste Text</button>
        <div style="flex-grow: 1;"></div>
        <select id="voice-select">
            <optgroup label="English Voices (Kokoro)">
                <option value="af" data-lang="en-us" selected>Heart (Female)</option>
                <option value="am_adam" data-lang="en-us">Adam (Male)</option>
                <option value="af_bella" data-lang="en-us">Bella (Female)</option>
                <option value="am_michael" data-lang="en-us">Michael (Male)</option>
            </optgroup>
        </select>
        <select id="speed-select">
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
        </select>
    </div>

    <div id="paste-container">
        <textarea id="paste-textarea" placeholder="Paste your raw text or article here..."></textarea>
        <div class="paste-actions">
            <button id="btn-cancel-paste" class="secondary">Cancel</button>
            <button id="btn-submit-text">Read Text</button>
        </div>
    </div>

    <div id="reader-container">
        <div class="loading" id="status-msg">
            Upload a PDF or paste text to start reading with neural audio.
        </div>
    </div>

    <div id="player-bar">
        <button class="icon-btn" id="btn-prev" title="Previous Sentence (←)">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="icon-btn primary" id="btn-play-pause" title="Play / Pause (Space)">
            <!-- Play Icon -->
            <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <!-- Pause Icon -->
            <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <!-- Loading Spinner -->
            <svg id="icon-loading" viewBox="0 0 24 24" style="display: none;" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                <path d="M12 2a10 10 0 0 1 10 10">
                    <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
                </path>
            </svg>
        </button>
        <button class="icon-btn" id="btn-stop" title="Stop">
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
        <button class="icon-btn" id="btn-next" title="Next Sentence (→)">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <div class="player-divider"></div>

        <div class="status-pill" id="status-pill">
            <span class="status-dot ready" id="status-dot"></span>
            <span id="status-text">Ready</span>
        </div>

        <div class="progress-pill" id="progress-pill">0/0</div>
    </div>

    <script>
        const fileUpload = document.getElementById('file-upload');
        const readerContainer = document.getElementById('reader-container');
        
        const voiceSelect = document.getElementById('voice-select');
        const speedSelect = document.getElementById('speed-select');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnStop = document.getElementById('btn-stop');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const iconLoading = document.getElementById('icon-loading');
        
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const progressPill = document.getElementById('progress-pill');

        const btnPasteMode = document.getElementById('btn-paste-mode');
        const btnCancelPaste = document.getElementById('btn-cancel-paste');
        const pasteContainer = document.getElementById('paste-container');
        const pasteTextarea = document.getElementById('paste-textarea');
        const btnSubmitText = document.getElementById('btn-submit-text');

        let paragraphs = [];
        let currentParagraphId = null;
        let currentSentenceIdx = 0;
        let currentDocId = '';
        
        let audioPlayer = new Audio();
        let isPlaying = false;
        
        // Audio Blob Cache: key -> { src: blobUrl, fromCache: boolean }
        const audioCache = new Map();
        let activePreloadController = null;

        function resetSession() {
            stopAudio();
            audioPlayer.removeAttribute('src');
            audioPlayer.load();
            
            // Revoke active blob URLs from previous session to free memory
            for (const [key, item] of audioCache.entries()) {
                if (item && item.src) {
                    try { URL.revokeObjectURL(item.src); } catch(e) {}
                }
            }
            audioCache.clear();
            
            currentParagraphId = null;
            currentSentenceIdx = 0;
            currentDocId = 'doc_' + Date.now();
        }

        function updateStatus(text, state = 'ready') {
            statusText.textContent = text;
            statusDot.className = `status-dot ${state}`;
        }

        function updateProgress(pCurr, pTotal, sCurr, sTotal) {
            progressPill.textContent = `P ${pCurr}/${pTotal} · S ${sCurr}/${sTotal}`;
        }

        function cancelActivePreload() {
            if (activePreloadController) {
                activePreloadController.abort();
                activePreloadController = null;
            }
        }

        function getVoiceAndLang() {
            const option = voiceSelect.options[voiceSelect.selectedIndex];
            return { voice: option.value, lang: option.dataset.lang };
        }

        function getAudioUrl(id, sentenceIdx) {
            const { voice, lang } = getVoiceAndLang();
            const docParam = currentDocId ? `&doc_id=${encodeURIComponent(currentDocId)}` : '';
            return `/api/audio?id=${id}&voice=${voice}&lang=${lang}&sentence_idx=${sentenceIdx}${docParam}&_t=${Date.now()}`;
        }

        async function preloadAudio(id, sentenceIdx) {
            const key = `${id}_${sentenceIdx}`;
            if (audioCache.has(key)) return;

            cancelActivePreload();
            const controller = new AbortController();
            activePreloadController = controller;

            const url = getAudioUrl(id, sentenceIdx);
            try {
                const response = await fetch(url, { signal: controller.signal });
                if (response.ok) {
                    const isCached = response.headers.get('X-From-Cache') === 'true';
                    const blob = await response.blob();
                    audioCache.set(key, {
                        src: URL.createObjectURL(blob),
                        fromCache: isCached
                    });
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    console.warn("Preload error:", e);
                }
            } finally {
                if (activePreloadController === controller) {
                    activePreloadController = null;
                }
            }
        }

        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            resetSession();
            const formData = new FormData();
            formData.append('file', file);

            readerContainer.innerHTML = '<div class="loading">Parsing PDF layout (Applying OCR if needed)...</div>';
            updateStatus('Parsing PDF & extracting text...', 'loading');

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error('Failed to parse PDF');
                const serverDocId = response.headers.get('X-Doc-Id');
                if (serverDocId) currentDocId = serverDocId;
                
                paragraphs = await response.json();
                renderParagraphs();
                
                if (paragraphs.length > 0) {
                    currentParagraphId = paragraphs[0].id;
                    currentSentenceIdx = 0;
                    updateHighlight(currentParagraphId, 0);
                    updateStatus('Pre-warming first sentence...', 'loading');
                    // Preload first sentence
                    preloadAudio(paragraphs[0].id, 0).then(() => {
                        updateStatus('⚡ Ready (Sentence 1 pre-cached)', 'ready');
                    });
                }
            } catch (err) {
                readerContainer.innerHTML = `<div class="loading" style="color: #ff5555;">Error: ${err.message}</div>`;
                updateStatus('Failed to load PDF', 'error');
            }
        });
        
        btnPasteMode.addEventListener('click', () => {
            readerContainer.style.display = 'none';
            pasteContainer.style.display = 'flex';
            pasteTextarea.focus();
        });

        btnCancelPaste.addEventListener('click', () => {
            pasteContainer.style.display = 'none';
            readerContainer.style.display = 'block';
        });

        btnSubmitText.addEventListener('click', async () => {
            const text = pasteTextarea.value.trim();
            if (!text) return;
            
            resetSession();
            pasteContainer.style.display = 'none';
            readerContainer.style.display = 'block';
            readerContainer.innerHTML = '<div class="loading">Parsing text & preparing speech engine...</div>';
            updateStatus('Parsing text...', 'loading');
            
            try {
                const response = await fetch('/api/text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                if (!response.ok) throw new Error('Failed to parse text');
                const serverDocId = response.headers.get('X-Doc-Id');
                if (serverDocId) currentDocId = serverDocId;
                
                paragraphs = await response.json();
                renderParagraphs();
                
                if (paragraphs.length > 0) {
                    currentParagraphId = paragraphs[0].id;
                    currentSentenceIdx = 0;
                    updateHighlight(currentParagraphId, 0);
                    updateStatus('Pre-warming first sentence...', 'loading');
                    // Preload sentence 0 immediately
                    preloadAudio(paragraphs[0].id, 0).then(() => {
                        updateStatus('⚡ Ready (Sentence 1 pre-cached)', 'ready');
                    });
                }
            } catch (err) {
                readerContainer.innerHTML = `<div class="loading" style="color: #ff5555;">Error: ${err.message}</div>`;
                updateStatus('Failed to parse text', 'error');
            }
        });

        function renderParagraphs() {
            readerContainer.innerHTML = '';
            if (paragraphs.length === 0) {
                readerContainer.innerHTML = '<div class="loading">No text found.</div>';
                updateProgress(0, 0, 0, 0);
                return;
            }

            paragraphs.forEach((p) => {
                const div = document.createElement('div');
                div.className = 'paragraph';
                div.id = `para-${p.id}`;

                // Render discrete sentences for fine-grained highlighting and clicking
                if (p.sentences && p.sentences.length > 0) {
                    p.sentences.forEach((sentenceText, sIdx) => {
                        const span = document.createElement('span');
                        span.className = 'sentence';
                        span.id = `sent-${p.id}-${sIdx}`;
                        span.textContent = sentenceText + ' ';
                        span.title = 'Click to read from this sentence';
                        
                        span.addEventListener('click', (e) => {
                            e.stopPropagation();
                            playSentence(p.id, sIdx);
                        });
                        
                        div.appendChild(span);
                    });
                } else {
                    div.textContent = p.text;
                }
                
                div.addEventListener('click', () => {
                    playSentence(p.id, 0);
                });
                
                readerContainer.appendChild(div);
            });
            
            currentParagraphId = paragraphs[0].id;
            currentSentenceIdx = 0;
            updateProgress(1, paragraphs.length, 1, paragraphs[0].sentences ? paragraphs[0].sentences.length : 1);
        }

        function updatePlayPauseUI(state) {
            isPlaying = (state === 'playing');
            iconPlay.style.display = 'none';
            iconPause.style.display = 'none';
            iconLoading.style.display = 'none';
            
            if (state === 'playing') {
                iconPause.style.display = 'block';
            } else if (state === 'loading') {
                iconLoading.style.display = 'block';
            } else {
                iconPlay.style.display = 'block';
            }
        }

        function getParagraphIndex(id) {
            return paragraphs.findIndex(p => p.id === id);
        }

        function setSentenceSynthesizing(pId, sIdx, isSynthesizing) {
            const el = document.getElementById(`sent-${pId}-${sIdx}`);
            if (el) {
                if (isSynthesizing) {
                    el.classList.add('synthesizing');
                } else {
                    el.classList.remove('synthesizing');
                }
            }
        }

        function updateHighlight(pId, sIdx) {
            // Remove previous active classes
            document.querySelectorAll('.paragraph.active').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sentence.active').forEach(el => el.classList.remove('active'));

            const pEl = document.getElementById(`para-${pId}`);
            if (pEl) {
                pEl.classList.add('active');
            }

            const sEl = document.getElementById(`sent-${pId}-${sIdx}`);
            if (sEl) {
                sEl.classList.add('active');
                
                // Smoothly scroll active sentence/paragraph into view if outside
                const rect = sEl.getBoundingClientRect();
                const viewHeight = Math.max(document.documentElement.clientHeight, window.innerHeight);
                if (rect.top < 100 || rect.bottom > viewHeight - 120) {
                    sEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        async function playSentence(paragraphId, sentenceIdx) {
            cancelActivePreload();
            currentParagraphId = paragraphId;
            currentSentenceIdx = sentenceIdx;
            await playCurrentSentence();
        }

        async function playCurrentSentence() {
            if (currentParagraphId === null || paragraphs.length === 0) return;
            
            const pIndex = getParagraphIndex(currentParagraphId);
            if (pIndex === -1) return;
            
            const p = paragraphs[pIndex];
            const sentenceCount = (p.sentences && p.sentences.length > 0) ? p.sentences.length : 1;
            
            // Check if sentence index exceeds bounds
            if (currentSentenceIdx >= sentenceCount) {
                if (pIndex + 1 < paragraphs.length) {
                    currentParagraphId = paragraphs[pIndex + 1].id;
                    currentSentenceIdx = 0;
                    return playCurrentSentence();
                } else {
                    stopAudio();
                    updateStatus('Finished reading', 'ready');
                    return;
                }
            }

            const key = `${currentParagraphId}_${currentSentenceIdx}`;
            
            // Highlight paragraph and sentence
            updateHighlight(currentParagraphId, currentSentenceIdx);
            updateProgress(pIndex + 1, paragraphs.length, currentSentenceIdx + 1, sentenceCount);

            let audioData = audioCache.get(key);
            let audioSrc = audioData ? audioData.src : null;
            let fromCache = audioData ? audioData.fromCache : false;

            if (!audioSrc) {
                // Sentence is not in memory cache; mark synthesizing
                setSentenceSynthesizing(currentParagraphId, currentSentenceIdx, true);
                updateStatus(`⏳ Synthesizing Sentence ${currentSentenceIdx + 1}/${sentenceCount}...`, 'loading');
                updatePlayPauseUI('loading');
                
                try {
                    const url = getAudioUrl(currentParagraphId, currentSentenceIdx);
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Speech synthesis error');
                    fromCache = response.headers.get('X-From-Cache') === 'true';
                    const blob = await response.blob();
                    audioSrc = URL.createObjectURL(blob);
                    audioCache.set(key, { src: audioSrc, fromCache });
                } catch (err) {
                    setSentenceSynthesizing(currentParagraphId, currentSentenceIdx, false);
                    updateStatus(`Synthesis failed: ${err.message}`, 'error');
                    updatePlayPauseUI('paused');
                    return;
                }
            }

            setSentenceSynthesizing(currentParagraphId, currentSentenceIdx, false);
            
            audioPlayer.src = audioSrc;
            audioPlayer.playbackRate = parseFloat(speedSelect.value);
            
            updatePlayPauseUI('loading');
            try {
                await audioPlayer.play();
                updatePlayPauseUI('playing');
                const cacheBadge = fromCache ? '⚡ Instant (Cached)' : 'Neural Audio';
                updateStatus(`▶ Reading S ${currentSentenceIdx + 1}/${sentenceCount} · ${cacheBadge}`, 'playing');
            } catch (e) {
                console.error("Playback interrupted", e);
                updatePlayPauseUI('paused');
                updateStatus('Paused', 'ready');
                return;
            }

            // Immediately trigger background preload for the next sentence!
            if (currentSentenceIdx + 1 < sentenceCount) {
                preloadAudio(p.id, currentSentenceIdx + 1);
            } else if (pIndex + 1 < paragraphs.length) {
                preloadAudio(paragraphs[pIndex + 1].id, 0);
            }
        }

        function stopAudio() {
            cancelActivePreload();
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            updatePlayPauseUI('paused');
            updateStatus('Stopped', 'ready');
        }

        // On audio sentence completion, advance seamlessly
        audioPlayer.addEventListener('ended', async () => {
            if (currentParagraphId === null) return;
            const pIndex = getParagraphIndex(currentParagraphId);
            const p = paragraphs[pIndex];
            const sentenceCount = (p.sentences && p.sentences.length > 0) ? p.sentences.length : 1;
            
            currentSentenceIdx++;
            if (currentSentenceIdx < sentenceCount) {
                await playCurrentSentence();
            } else if (pIndex + 1 < paragraphs.length) {
                currentParagraphId = paragraphs[pIndex + 1].id;
                currentSentenceIdx = 0;
                await playCurrentSentence();
            } else {
                stopAudio();
                updateStatus('Completed document', 'ready');
            }
        });

        btnPlayPause.addEventListener('click', () => {
            if (paragraphs.length === 0) return;
            
            if (isPlaying) {
                audioPlayer.pause();
                updatePlayPauseUI('paused');
                updateStatus('Paused', 'ready');
            } else {
                if (currentParagraphId === null) {
                    currentParagraphId = paragraphs[0].id;
                    currentSentenceIdx = 0;
                }
                
                if (audioPlayer.src && audioPlayer.currentTime > 0 && !audioPlayer.ended) {
                    audioPlayer.play();
                    updatePlayPauseUI('playing');
                    updateStatus('▶ Resumed playback', 'playing');
                } else {
                    playCurrentSentence();
                }
            }
        });

        btnStop.addEventListener('click', stopAudio);

        btnNext.addEventListener('click', () => {
            if (currentParagraphId === null || paragraphs.length === 0) return;
            const pIndex = getParagraphIndex(currentParagraphId);
            const p = paragraphs[pIndex];
            const sentenceCount = (p.sentences && p.sentences.length > 0) ? p.sentences.length : 1;
            
            if (currentSentenceIdx + 1 < sentenceCount) {
                playSentence(currentParagraphId, currentSentenceIdx + 1);
            } else if (pIndex + 1 < paragraphs.length) {
                playSentence(paragraphs[pIndex + 1].id, 0);
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentParagraphId === null || paragraphs.length === 0) return;
            const pIndex = getParagraphIndex(currentParagraphId);
            
            if (audioPlayer.currentTime > 2) {
                // If more than 2 seconds into current sentence, restart this sentence
                audioPlayer.currentTime = 0;
                audioPlayer.play();
            } else if (currentSentenceIdx > 0) {
                // Go to previous sentence in same paragraph
                playSentence(currentParagraphId, currentSentenceIdx - 1);
            } else if (pIndex > 0) {
                // Go to last sentence of previous paragraph
                const prevP = paragraphs[pIndex - 1];
                const prevSentences = prevP.sentences && prevP.sentences.length > 0 ? prevP.sentences.length : 1;
                playSentence(prevP.id, prevSentences - 1);
            }
        });

        speedSelect.addEventListener('change', () => {
            audioPlayer.playbackRate = parseFloat(speedSelect.value);
        });
        
        voiceSelect.addEventListener('change', () => {
            const savedPId = currentParagraphId;
            const savedSIdx = currentSentenceIdx;
            const wasPlaying = isPlaying;
            resetSession();
            if (paragraphs.length > 0) {
                currentParagraphId = savedPId !== null ? savedPId : paragraphs[0].id;
                currentSentenceIdx = savedSIdx;
                updateHighlight(currentParagraphId, currentSentenceIdx);
                if (wasPlaying) {
                    playCurrentSentence();
                } else {
                    updateStatus('Voice updated', 'ready');
                }
            }
        });

        // Keyboard navigation shortcuts
        window.addEventListener('keydown', (e) => {
            // Don't trigger shortcuts if user is typing in textarea
            if (document.activeElement === pasteTextarea) return;

            if (e.code === 'Space') {
                e.preventDefault();
                btnPlayPause.click();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                btnNext.click();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                btnPrev.click();
            }
        });
    </script>
</body>
</html>
